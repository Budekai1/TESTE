<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Python + HTML no GitHub Pages</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #0A2540; color: #fff; padding: 40px; }
    .card { background: #133356; padding: 25px; border-radius: 8px; max-width: 450px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
    button { background: #E30613; color: #fff; border: none; padding: 10px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
    #retorno { margin-top: 15px; padding: 12px; background: #002244; border-left: 4px solid #22c55e; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Python + HTML no GitHub</h2>
    <input type="text" id="lote" placeholder="Digite um lote para o Python processar...">
    <button py-click="processar">Executar Python</button>
    <div id="retorno">Aguardando entrada...</div>
  </div>

  <script type="py">
    from pyscript import document

    def processar(event):
        valor = document.querySelector("#lote").value.strip().upper()
        saida = document.querySelector("#retorno")
        if not valor:
            saida.innerText = "⚠️ Digite algum lote primeiro."
        else:
            saida.innerText = f"✅ Lote {valor} processado pelo Python no GitHub Pages!"
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Python + HTML no GitHub</title>
  <!-- Carrega o motor Python (PyScript) direto no navegador -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #0A2540; color: #fff; padding: 30px; }
    button { background: #E30613; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    #resultado { margin-top: 20px; padding: 15px; background: #133356; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>Processador Python na Web</h2>
  <input type="text" id="entrada_lote" placeholder="Digite um código de lote...">
  <button py-click="processar_lote">Executar Python</button>
  
  <div id="resultado">Aguardando execução...</div>

  <!-- Seu código Python rodando direto na página -->
  <script type="py">
    from pyscript import document

    def processar_lote(event):
        texto = document.querySelector("#entrada_lote").value.strip().upper()
        saida = document.querySelector("#resultado")
        if not texto:
            saida.innerText = "⚠️ Digite algum valor primeiro."
        else:
            saida.innerText = f"✅ Lote processado pelo Python: {texto} (Total de caracteres: {len(texto)})"
  </script>
</body>
</html>
